<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>베이킹 발주 관리</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;font-size:14px;background:#f5f4f0;color:#1a1a18;min-height:100vh}
header{background:#fff;border-bottom:1px solid #e5e4e0;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:50}
.logo{font-size:16px;font-weight:600}.logo span{font-size:12px;font-weight:400;color:#888;margin-left:6px}
.nav{display:flex}
.nav-btn{padding:8px 14px;font-size:13px;cursor:pointer;border:none;background:none;color:#666;border-bottom:2px solid transparent;transition:.15s;font-family:inherit}
.nav-btn.active{color:#1a1a18;border-bottom:2px solid #1a1a18;font-weight:500}
.main{max-width:760px;margin:0 auto;padding:1.25rem 1rem}
.card{background:#fff;border:1px solid #e5e4e0;border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
label{font-size:12px;color:#666;display:block;margin-bottom:3px}
input,select,textarea{font-family:inherit;font-size:14px;color:#1a1a18;background:#fff;border:1px solid #d5d4d0;border-radius:8px;padding:8px 10px;width:100%;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#888}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid #d5d4d0;background:#fff;color:#1a1a18;padding:7px 14px;transition:.15s}
button:hover{background:#f5f4f0}
button:active{transform:scale(.98)}
.btn-primary{background:#1a1a18;color:#fff;border-color:#1a1a18}
.btn-primary:hover{background:#333}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{color:#c0392b;border-color:#e5b4b0}
.btn-danger:hover{background:#fef0ef}
.row{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
.flex-1{flex:1}.flex-2{flex:2}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.stat{background:#f5f4f0;border-radius:8px;padding:.75rem 1rem;text-align:center}
.stat-label{font-size:11px;color:#888;margin-bottom:4px}
.stat-val{font-size:20px;font-weight:600}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.b-amber{background:#faeeda;color:#633806}
.b-teal{background:#e1f5ee;color:#085041}
.b-purple{background:#eeedfe;color:#3c3489}
.b-green{background:#eaf3de;color:#27500a}
.result-row{display:grid;grid-template-columns:1fr 110px 80px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #f0efeb}
.result-row:last-child{border-bottom:none}
.plan-card{border:1px solid #e5e4e0;border-radius:10px;padding:.875rem 1rem;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:center}
.count-btn{width:28px;height:28px;border-radius:6px;border:1px solid #d5d4d0;background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0}
.count-num{font-size:18px;font-weight:600;min-width:32px;text-align:center}
/* 재료 그룹 에디터 */
.ing-group{border:1px solid #e5e4e0;border-radius:10px;margin-bottom:10px;overflow:hidden}
.ing-group-header{background:#f5f4f0;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.ing-group-body{padding:8px 12px}
.ing-row{display:grid;grid-template-columns:1fr 76px 68px 28px;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid #f0efeb}
.ing-row:last-child{border-bottom:none}
/* 제조공정 그룹 에디터 */
.step-group{border:1px solid #e5e4e0;border-radius:10px;margin-bottom:10px;overflow:hidden}
.step-group-header{background:#f5f4f0;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.step-group-body{padding:8px 12px}
.step-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #f0efeb}
.step-row:last-child{border-bottom:none}
.step-num-badge{width:22px;height:22px;border-radius:50%;background:#1a1a18;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:7px}
.recipe-card{border:1px solid #e5e4e0;border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden}
.recipe-card-body{padding:1rem 1.25rem}
.recipe-thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;flex-shrink:0}
.recipe-thumb-placeholder{width:72px;height:72px;border-radius:8px;background:#f5f4f0;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.tag{display:inline-block;background:#f5f4f0;border:1px solid #e5e4e0;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px}
.history-card{border:1px solid #e5e4e0;border-radius:10px;padding:1rem 1.25rem;margin-bottom:8px;background:#fff}
.empty{text-align:center;color:#aaa;padding:3rem 0}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-start;justify-content:center;padding:1rem;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:520px;margin:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.modal-title{font-size:16px;font-weight:600}
.close-btn{background:none;border:none;font-size:20px;cursor:pointer;color:#888;padding:0}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1a1a18;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.gdrive-tip{background:#e8f4fd;border:1px solid #b3d9f7;border-radius:8px;padding:10px 12px;font-size:12px;color:#1a5276;line-height:1.7;margin-bottom:8px}
.temp-box{background:#fff8f0;border:1px solid #f0d8b0;border-radius:8px;padding:8px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap}
</style>
</head>
<body>

<header>
  <div class="logo">베이킹 발주 <span>학원 공유</span></div>
  <nav class="nav">
    <button class="nav-btn active" onclick="switchTab('plan')">수업계획</button>
    <button class="nav-btn" onclick="switchTab('recipe')">레시피</button>
    <button class="nav-btn" onclick="switchTab('history')">발주이력</button>
  </nav>
</header>

<div class="main">

  <!-- 수업 계획 탭 -->
  <div id="tab-plan" style="display:block">
    <div class="stat-grid">
      <div class="stat"><div class="stat-label">수업 종류</div><div class="stat-val" id="s-cls">0</div></div>
      <div class="stat"><div class="stat-label">총 인원</div><div class="stat-val" id="s-stu">0</div></div>
      <div class="stat"><div class="stat-label">재료 종류</div><div class="stat-val" id="s-ing">0</div></div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:500;color:#666;margin-bottom:10px">수업 추가</div>
      <div class="row">
        <div class="flex-2"><label>레시피</label><select id="plan-recipe"><option value="">선택...</option></select></div>
        <div class="flex-1"><label>인원(명)</label><input type="number" id="plan-count" value="1" min="1" style="text-align:center"></div>
        <button class="btn-primary" onclick="addPlanItem()" style="white-space:nowrap;margin-bottom:1px">+ 추가</button>
      </div>
    </div>
    <div id="plan-list"><div class="empty"><div style="font-size:32px;margin-bottom:8px">📋</div>수업을 추가해 주세요</div></div>
    <div id="result-section" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin:1rem 0 8px">
        <div style="font-weight:600;font-size:15px">재료 합산 발주 목록</div>
        <div style="display:flex;gap:6px">
          <button class="btn-sm" onclick="copyOrderText()">📋 복사</button>
          <button class="btn-sm" onclick="clearPlan()">초기화</button>
          <button class="btn-primary btn-sm" onclick="saveOrderFromPlan()">발주 저장</button>
        </div>
      </div>
      <div class="card" style="padding:.75rem 1.25rem">
        <div style="display:grid;grid-template-columns:1fr 110px 80px;gap:8px;padding:4px 0 8px;border-bottom:1px solid #f0efeb">
          <div style="font-size:12px;color:#888">재료명</div>
          <div style="font-size:12px;color:#888">총 수량</div>
          <div style="font-size:12px;color:#888">발주단위</div>
        </div>
        <div id="result-list"></div>
      </div>
    </div>
  </div>

  <!-- 레시피 탭 -->
  <div id="tab-recipe" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px">
      <div style="display:flex;gap:6px">
        <select id="recipe-filter-cat" onchange="renderRecipes()" style="width:130px;font-size:13px">
          <option value="">전체 카테고리</option>
          <option>제과기능사</option><option>제빵기능사</option><option>홈베이커리</option>
          <option>채식베이커리</option><option>디저트</option><option>기타</option>
        </select>
        <input type="text" id="recipe-search" placeholder="레시피 검색..." oninput="renderRecipes()" style="width:150px;font-size:13px">
      </div>
      <div style="display:flex;gap:6px">
        <button onclick="printAllRecipes()" class="btn-sm">🖨️ 전체 인쇄</button>
        <button class="btn-primary" onclick="openRecipeModal()">+ 레시피 등록</button>
      </div>
    </div>
    <div id="recipe-list"></div>
  </div>

  <!-- 발주 이력 탭 -->
  <div id="tab-history" style="display:none">
    <div id="history-list"></div>
  </div>
</div>

<!-- 레시피 등록/수정 모달 -->
<div class="modal-bg" id="recipe-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">레시피 등록</div>
      <button class="close-btn" onclick="closeRecipeModal()">✕</button>
    </div>
    <label>레시피명</label>
    <input type="text" id="r-name" placeholder="예: 마들렌" style="margin-bottom:10px">
    <label>카테고리</label>
    <select id="r-cat" style="margin-bottom:12px">
      <option>제과기능사</option><option>제빵기능사</option><option>홈베이커리</option>
      <option>채식베이커리</option><option>디저트</option><option>기타</option>
    </select>
    <label>제품 사진 URL</label>
    <div class="gdrive-tip">📌 구글 드라이브: 사진 업로드 → 우클릭 → 공유 → 링크 복사</div>
    <input type="text" id="r-photo" placeholder="https://drive.google.com/..." oninput="previewPhoto()" style="margin-bottom:8px">
    <img id="r-photo-preview" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:none" alt="미리보기">

    <div style="display:flex;gap:8px;margin-bottom:14px">
      <div style="flex:1"><label>윗불 온도 (°C)</label><input type="number" id="r-top-temp" placeholder="예: 180"></div>
      <div style="flex:1"><label>아랫불 온도 (°C)</label><input type="number" id="r-bottom-temp" placeholder="예: 160"></div>
      <div style="flex:1"><label>굽는 시간 (분)</label><input type="number" id="r-bake-time" placeholder="예: 25"></div>
    </div>

    <!-- 재료 그룹 -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:13px;font-weight:500;color:#666">재료 그룹 (1인분 기준)</div>
      <button class="btn-sm" onclick="addIngGroup()">+ 그룹 추가</button>
    </div>
    <div id="ing-group-editor" style="margin-bottom:14px"></div>

    <!-- 제조공정 그룹 -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:13px;font-weight:500;color:#666">제조공정 그룹</div>
      <button class="btn-sm" onclick="addStepGroup()">+ 그룹 추가</button>
    </div>
    <div id="step-group-editor" style="margin-bottom:14px"></div>

    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button onclick="closeRecipeModal()">취소</button>
      <button class="btn-primary" onclick="saveRecipe()">저장</button>
    </div>
  </div>
</div>

<!-- 레시피 상세 모달 -->
<div class="modal-bg" id="detail-modal">
  <div class="modal" style="max-width:580px">
    <div class="modal-header">
      <div class="modal-title" id="detail-modal-title">레시피 상세</div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn-sm" onclick="printRecipe()">🖨️ 인쇄</button>
        <button class="close-btn" onclick="document.getElementById('detail-modal').classList.remove('open')">✕</button>
      </div>
    </div>
    <div id="detail-modal-content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

var recipes=[], planItems=[], editingId=null, tempIngGroups=[], tempStepGroups=[], printingRecipe=null;
var CAT_CLS={'제과기능사':'b-amber','제빵기능사':'b-teal','홈베이커리':'b-purple','채식베이커리':'b-green','디저트':'b-purple','기타':'b-teal'};

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}
function catBadge(cat){return '<span class="badge '+(CAT_CLS[cat]||'b-teal')+'">'+cat+'</span>';}
function convertDriveUrl(url){if(!url)return '';var m=url.match(/\/d\/([a-zA-Z0-9_-]+)/);if(m)return 'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400';return url;}
function previewPhoto(){var url=convertDriveUrl(document.getElementById('r-photo').value.trim());var img=document.getElementById('r-photo-preview');if(url){img.src=url;img.style.display='block';}else{img.style.display='none';}}

async function api(action,body){
  try{
    var opts=body?{method:'POST',body:JSON.stringify(Object.assign({action:action},body))}:{method:'GET'};
    var url=body?API_URL:API_URL+'?action='+action;
    var res=await fetch(url,opts);
    return await res.json();
  }catch(e){showToast('연결 오류: '+e.message);return null;}
}

async function loadAll(){await Promise.all([loadRecipes(),loadHistory()]);}

async function loadRecipes(){
  var data=await api('getRecipes');
  if(!data)return;
  recipes=data.recipes||[];
  refreshRecipeSelect();
  renderRecipes();
}

async function loadHistory(){
  var data=await api('getOrders');
  if(!data)return;
  renderHistory(data.orders||[]);
}

function refreshRecipeSelect(){
  var sel=document.getElementById('plan-recipe');
  sel.innerHTML='<option value="">레시피 선택...</option>'+
    recipes.map(function(r){return '<option value="'+r.id+'">'+r.name+' ('+r.cat+')</option>';}).join('');
}

// ── 수업 계획 ──────────────────────────────────────────
function addPlanItem(){
  var rid=document.getElementById('plan-recipe').value;
  var cnt=parseInt(document.getElementById('plan-count').value)||1;
  if(!rid){showToast('레시피를 선택해 주세요');return;}
  var rec=recipes.find(function(r){return r.id==rid;});
  if(!rec)return;
  var exist=planItems.find(function(p){return p.recipeId==rid;});
  if(exist){exist.count+=cnt;}else{planItems.push({recipeId:rid,name:rec.name,cat:rec.cat,count:cnt});}
  document.getElementById('plan-count').value=1;
  renderPlan();
}

function renderPlan(){
  var el=document.getElementById('plan-list');
  var rs=document.getElementById('result-section');
  if(!planItems.length){
    el.innerHTML='<div class="empty"><div style="font-size:32px;margin-bottom:8px">📋</div>수업을 추가해 주세요</div>';
    rs.style.display='none';updateStats(0,0,0);return;
  }
  el.innerHTML='<div style="font-size:13px;font-weight:500;color:#666;margin-bottom:8px">이번 주 수업</div>'+
    planItems.map(function(p,i){
      return '<div class="plan-card">'+
        '<div><div style="font-weight:500;margin-bottom:3px">'+p.name+' '+catBadge(p.cat)+'</div>'+
        '<div style="font-size:12px;color:#888">수강 인원</div></div>'+
        '<div style="display:flex;align-items:center;gap:8px">'+
        '<button class="count-btn" onclick="chgCount('+i+',-1)">−</button>'+
        '<span class="count-num">'+p.count+'</span>'+
        '<button class="count-btn" onclick="chgCount('+i+',1)">+</button>'+
        '<span style="font-size:13px;color:#888">명</span>'+
        '<button onclick="rmPlan('+i+')" style="border:none;background:none;cursor:pointer;color:#aaa;font-size:16px">✕</button></div></div>';
    }).join('');
  rs.style.display='block';
  calcResult();
}

function chgCount(i,d){planItems[i].count=Math.max(1,planItems[i].count+d);renderPlan();}
function rmPlan(i){planItems.splice(i,1);renderPlan();}
function clearPlan(){if(!confirm('초기화하시겠습니까?'))return;planItems=[];renderPlan();}

function calcResult(){
  var totals={};
  planItems.forEach(function(p){
    var rec=recipes.find(function(r){return r.id==p.recipeId;});
    if(!rec)return;
    var allIngs=[];
    if(rec.ingGroups && rec.ingGroups.length){
      rec.ingGroups.forEach(function(g){(g.ings||[]).forEach(function(ing){allIngs.push(ing);});});
    } else {
      (rec.ings||[]).forEach(function(ing){allIngs.push(ing);});
    }
    allIngs.forEach(function(ing){
      var key=ing.name+'__'+ing.unit;
      if(!totals[key])totals[key]={name:ing.name,unit:ing.unit,total:0,srcs:[]};
      totals[key].total+=ing.qty*p.count;
      totals[key].srcs.push(p.name+' '+p.count+'명');
    });
  });
  var entries=Object.values(totals);
  document.getElementById('result-list').innerHTML=entries.map(function(e){
    var disp=Math.round(e.total*10)/10;
    var guide='';
    if(e.unit==='g'&&e.total>=1000)guide='≈'+Math.round(e.total/100)/10+'kg';
    else if(e.unit==='ml'&&e.total>=1000)guide='≈'+Math.round(e.total/100)/10+'L';
    else if(e.unit==='개')guide='총 '+Math.ceil(e.total)+'개';
    return '<div class="result-row">'+
      '<div><div style="font-weight:500">'+e.name+'</div>'+
      '<div style="font-size:11px;color:#888">'+e.srcs.join(' / ')+'</div></div>'+
      '<div style="font-size:15px;font-weight:600">'+disp+' '+e.unit+'</div>'+
      '<div style="font-size:12px;color:#888">'+guide+'</div></div>';
  }).join('');
  updateStats(planItems.length,planItems.reduce(function(s,p){return s+p.count;},0),entries.length);
}

function updateStats(c,s,i){
  document.getElementById('s-cls').textContent=c;
  document.getElementById('s-stu').textContent=s;
  document.getElementById('s-ing').textContent=i;
}

function copyOrderText(){
  var totals={};
  planItems.forEach(function(p){
    var rec=recipes.find(function(r){return r.id==p.recipeId;});
    if(!rec)return;
    var allIngs=[];
    if(rec.ingGroups&&rec.ingGroups.length){rec.ingGroups.forEach(function(g){(g.ings||[]).forEach(function(ing){allIngs.push(ing);});});}
    else{(rec.ings||[]).forEach(function(ing){allIngs.push(ing);});}
    allIngs.forEach(function(ing){
      var key=ing.name+'__'+ing.unit;
      if(!totals[key])totals[key]={name:ing.name,unit:ing.unit,total:0};
      totals[key].total+=ing.qty*p.count;
    });
  });
  var date=new Date().toLocaleDateString('ko-KR');
  var lines=['[베이킹 발주] '+date,'수업: '+planItems.map(function(p){return p.name+' '+p.count+'명';}).join(', '),''];
  Object.values(totals).forEach(function(e){lines.push(e.name+' '+Math.round(e.total*10)/10+e.unit);});
  navigator.clipboard.writeText(lines.join('\n')).then(function(){showToast('클립보드에 복사됐어요!');});
}

    });
  });
  var order={date:new Date().toLocaleDateString('ko-KR'),classes:planItems.map(function(p){return p.name+' '+p.count+'명';}).join(', '),items:Object.values(totals).map(function(e){return{name:e.name,qty:Math.round(e.total*10)/10,unit:e.unit};})};
  var res=await api('saveOrder',{order:order});
  if(res&&res.success){showToast('발주가 저장됐어요!');planItems=[];renderPlan();loadHistory();}
}

function removeIngFromGroup(gi,ii){tempIngGroups[gi].ings.splice(ii,1);renderIngGroupEditor();}

// ── 레시피 카드 렌더링 ────────────────────────────────
function renderRecipes(){
  var q=(document.getElementById('recipe-search').value||'').toLowerCase();
  var fc=document.getElementById('recipe-filter-cat').value;
  var filtered=recipes.filter(function(r){return(!q||r.name.toLowerCase().includes(q))&&(!fc||r.cat===fc);});
  var el=document.getElementById('recipe-list');
  if(!filtered.length){el.innerHTML='<div class="empty"><div style="font-size:32px;margin-bottom:8px">📖</div>레시피가 없습니다</div>';return;}
  el.innerHTML=filtered.map(function(r){
    var photoUrl=convertDriveUrl(r.photo||'');

      ?'<img src="'+photoUrl+'" class="recipe-thumb" onerror="this.style.display='none'">'
      :'<div class="recipe-thumb-placeholder">🍞</div>';
    var totalIngs=0;
    if(r.ingGroups&&r.ingGroups.length){r.ingGroups.forEach(function(g){totalIngs+=(g.ings||[]).length;});}
    else{totalIngs=(r.ings||[]).length;}
    var totalSteps=0;
    if(r.stepGroups&&r.stepGroups.length){r.stepGroups.forEach(function(g){totalSteps+=(g.steps||[]).length;});}

      '<div style="display:flex;gap:12px;align-items:flex-start">'+

      '<div style="flex:1">'+

      '<div style="font-size:12px;color:#888;margin-bottom:4px">재료 '+totalIngs+'가지'+(totalSteps?' · 과정 '+totalSteps+'단계':'')+'</div>'+
      tempInfo+
      '</div></div></div></div>';
  }).join('');
}

function printRecipe(){
  if(!printingRecipe)return;
  var w=window.open('','_blank');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+printingRecipe.name+' 레시피</title>';
  html+='<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#fff;color:#2c2c2c}</style>';
  html+='</head><body>'+buildPrintPage(printingRecipe)+'</body></html>';
  w.document.write(html);
  w.document.close();
  setTimeout(function(){w.print();},800);
}

function printAllRecipes(){
  var fc=document.getElementById('recipe-filter-cat').value;
  var list=fc?recipes.filter(function(r){return r.cat===fc;}):recipes;
  if(!list.length){showToast('레시피가 없습니다');return;}
  var w=window.open('','_blank');
  var pages=list.map(function(r,i){
    return '<div style="page-break-after:'+(i<list.length-1?'always':'auto')+'">'+buildPrintPage(r)+'</div>';
  }).join('');
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>레시피 전체 인쇄</title>';
  html+='<style>*{box-sizing:border-box;margin:0;padding:0}body{background:#fff;color:#2c2c2c}</style>';
  html+='</head><body>'+pages+'</body></html>';
  w.document.write(html);
  w.document.close();
  setTimeout(function(){w.print();},800);
}

// ── 레시피 등록/수정 ──────────────────────────────────
function openRecipeModal(r){
  editingId=r?r.id:null;
  document.getElementById('modal-title').textContent=r?'레시피 수정':'레시피 등록';
  document.getElementById('r-name').value=r?r.name:'';
  document.getElementById('r-cat').value=r?r.cat:'제과기능사';
  document.getElementById('r-photo').value=r?(r.photo||''):'';
  document.getElementById('r-photo-preview').style.display='none';
  if(r&&r.photo){document.getElementById('r-photo-preview').src=convertDriveUrl(r.photo);document.getElementById('r-photo-preview').style.display='block';}
  document.getElementById('r-top-temp').value=r?(r.topTemp||''):'';
  document.getElementById('r-bottom-temp').value=r?(r.bottomTemp||''):'';
  document.getElementById('r-bake-time').value=r?(r.bakeTime||''):'';

  // 재료 그룹
  if(r&&r.ingGroups&&r.ingGroups.length){
    tempIngGroups=JSON.parse(JSON.stringify(r.ingGroups));
  } else if(r&&r.ings&&r.ings.length){
    tempIngGroups=[{groupName:'반죽',ings:JSON.parse(JSON.stringify(r.ings))}];
  } else {
    tempIngGroups=[{groupName:'반죽',ings:[{name:'',qty:0,unit:'g'}]}];
  }

  // 제조공정 그룹
  if(r&&r.stepGroups&&r.stepGroups.length){
    tempStepGroups=JSON.parse(JSON.stringify(r.stepGroups));
  } else if(r&&r.steps&&r.steps.length){
    tempStepGroups=[{groupName:'반죽',steps:JSON.parse(JSON.stringify(r.steps))}];
  } else {
    tempStepGroups=[{groupName:'반죽',steps:['']}];
  }

  renderIngGroupEditor();
  renderStepGroupEditor();
  document.getElementById('recipe-modal').classList.add('open');
}

function closeRecipeModal(){document.getElementById('recipe-modal').classList.remove('open');}
function editRecipe(id){var r=recipes.find(function(x){return x.id==id;});if(r)openRecipeModal(r);}

async function deleteRecipe(id){
  if(!confirm('삭제하시겠습니까?'))return;
  var res=await api('deleteRecipe',{id:id});
  if(res&&res.success){showToast('삭제됐어요');loadRecipes();}
}

async function saveRecipe(){
  var name=document.getElementById('r-name').value.trim();
  if(!name){showToast('레시피명을 입력해 주세요');return;}
  var validGroups=tempIngGroups.map(function(g){
    return{groupName:g.groupName,ings:g.ings.filter(function(i){return i.name.trim()&&i.qty>0;})};
  }).filter(function(g){return g.ings.length>0;});
  if(!validGroups.length){showToast('재료를 1개 이상 입력해 주세요');return;}
  var validStepGroups=tempStepGroups.map(function(g){
    return{groupName:g.groupName,steps:g.steps.filter(function(s){return s.trim();})};
  }).filter(function(g){return g.steps.length>0;});
  var recipe={
    id:editingId||null,name:name,cat:document.getElementById('r-cat').value,
    photo:document.getElementById('r-photo').value.trim(),
    topTemp:document.getElementById('r-top-temp').value||'',
    bottomTemp:document.getElementById('r-bottom-temp').value||'',
    bakeTime:document.getElementById('r-bake-time').value||'',
    ingGroups:validGroups,stepGroups:validStepGroups
  };
  var res=await api('saveRecipe',{recipe:recipe});
  if(res&&res.success){showToast(editingId?'수정됐어요!':'등록됐어요!');closeRecipeModal();loadRecipes();}
}

// ── 탭 전환 ───────────────────────────────────────────
